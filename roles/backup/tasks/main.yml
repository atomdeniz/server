---
- name: Remove the distro restic package
  ansible.builtin.package:
    name: restic
    state: absent
  when: restic_backup_enabled | bool

- name: Check the installed restic version
  ansible.builtin.command: /usr/local/bin/restic version
  register: restic_installed_version
  failed_when: false
  changed_when: false
  when: restic_backup_enabled | bool

- name: Install restic {{ restic_version }}
  when:
    - restic_backup_enabled | bool
    - ("restic " ~ restic_version ~ " ") not in (restic_installed_version.stdout | default(""))
  block:
    - name: Download restic {{ restic_version }}
      ansible.builtin.get_url:
        url: "{{ restic_release_url }}/restic_{{ restic_version }}_linux_{{ restic_arch }}.bz2"
        checksum: "sha256:{{ restic_release_url }}/SHA256SUMS"
        dest: "/tmp/restic_{{ restic_version }}.bz2"
        mode: "0600"

    - name: Unpack restic {{ restic_version }}
      ansible.builtin.shell: >
        set -o pipefail &&
        bunzip2 -c /tmp/restic_{{ restic_version }}.bz2 > /usr/local/bin/restic.new &&
        chmod 0755 /usr/local/bin/restic.new &&
        mv /usr/local/bin/restic.new /usr/local/bin/restic &&
        rm -f /tmp/restic_{{ restic_version }}.bz2
      args:
        executable: /bin/bash
      changed_when: true

- name: Create DB dump directory
  ansible.builtin.file:
    path: "{{ restic_db_dump_dir }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0700"
  when: restic_backup_enabled | bool

- name: Write restic password file
  ansible.builtin.copy:
    content: "{{ restic_password }}"
    dest: "/etc/restic-password"
    owner: root
    group: root
    mode: "0600"
  when: restic_backup_enabled | bool

- name: Check if restic repo is initialized
  ansible.builtin.command: >
    restic -r {{ restic_repo_path }} -p /etc/restic-password snapshots
  register: restic_repo_check
  failed_when: false
  changed_when: false
  when: restic_backup_enabled | bool

- name: Initialize restic repo
  ansible.builtin.command: >
    restic -r {{ restic_repo_path }} -p /etc/restic-password init
  when:
    - restic_backup_enabled | bool
    - restic_repo_check.rc != 0
  changed_when: true

- name: Install backup script
  ansible.builtin.template:
    src: restic-backup.sh.j2
    dest: /usr/local/bin/restic-backup
    owner: root
    group: root
    mode: "0700"
  when: restic_backup_enabled | bool

- name: Install restic-backup systemd service
  become: true
  ansible.builtin.template:
    src: restic-backup.service.j2
    dest: /etc/systemd/system/restic-backup.service
    mode: "0644"
  when: restic_backup_enabled | bool

- name: Install restic-backup systemd timer
  become: true
  ansible.builtin.template:
    src: restic-backup.timer.j2
    dest: /etc/systemd/system/restic-backup.timer
    mode: "0644"
  when: restic_backup_enabled | bool

- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: restic_backup_enabled | bool

- name: Enable and start restic-backup timer
  become: true
  ansible.builtin.systemd:
    name: restic-backup.timer
    enabled: true
    state: started
  when: restic_backup_enabled | bool
