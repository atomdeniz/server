---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Disable netfilter-persistent (conflicts with iptables.service)
  ansible.builtin.systemd_service:
    name: netfilter-persistent
    state: stopped
    enabled: false
  when: "'netfilter-persistent.service' in ansible_facts.services"

- name: Template the iptables rules
  ansible.builtin.template:
    src: iptables.conf
    dest: /etc/iptables.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart iptables

- name: Check the location of iptables-restore
  ansible.builtin.command:
    cmd: "which iptables-restore"
  register: iptables_restore
  changed_when: false
  failed_when: "iptables_restore.stdout | length == 0"

- name: Template the iptables systemd service
  ansible.builtin.template:
    src: systemd/iptables.service.j2
    dest: /etc/systemd/system/iptables.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart iptables

- name: Enable and start the iptables service
  become: true
  ansible.builtin.service:
    name: iptables
    state: started
    enabled: true
    daemon_reload: true
