---
- name: Look up the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ username }}"

- name: Create node_exporter textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create node exporter container
  community.docker.docker_container:
    name: node_exporter
    image: quay.io/prometheus/node-exporter:{{ node_exporter_version }}
    pull: "always"
    recreate: "{{ force_recreate | default(false) }}"
    state: started
    restart_policy: unless-stopped
    user: "{{ ansible_facts.getent_passwd[username][1] }}:{{ ansible_facts.getent_passwd[username][2] }}"
    pid_mode: host
    command: "--path.rootfs=/host --collector.textfile.directory=/host{{ node_exporter_textfile_dir }}"
    cap_drop:
      - ALL
    security_opts:
      - no-new-privileges:true
      - apparmor:docker-default
    volumes:
      - /:/host:ro,rslave
    networks:
      - name: ops_network

- name: Create cadvisor container
  community.docker.docker_container:
    name: cadvisor
    image: ghcr.io/google/cadvisor:{{ cadvisor_version }}
    pull: "always"
    recreate: "{{ force_recreate | default(false) }}"
    state: started
    restart_policy: unless-stopped
    security_opts:
      - no-new-privileges:true
      - apparmor:docker-default
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    memory: "256M"
    command: "--housekeeping_interval=30s --docker_only=true --disable_metrics=cpu_topology,resctrl,hugetlb,referenced_memory,memory_numa,disk --store_container_labels=false"
    devices:
      - /dev/kmsg
    networks:
      - name: ops_network

- name: Deploy Grafana and Prometheus
  ansible.builtin.import_tasks: stack.yml
  when: monitoring_primary
