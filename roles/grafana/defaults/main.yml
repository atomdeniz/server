---
prometheus_version: "v3.13.1"
node_exporter_version: "v1.12.1"
grafana_version: "13.0.2"
cadvisor_version: "v0.55.1"

# node_exporter textfile collector dir (host side); backup writes restic.prom here
node_exporter_textfile_dir: /var/lib/node_exporter

# Alert thresholds (Grafana unified alerting → Telegram)
alert_disk_used_percent: 85
alert_mem_used_percent: 90
alert_load15: 6
alert_cert_expiry_days: 14
alert_crashloop_restarts: 3
alert_backup_age_hours: 36
