apiVersion: 1

groups:
  - orgId: 1
    name: infra
    folder: Alerts
    interval: 1m
    rules:
      - uid: host-disk-usage-high
        title: Host disk usage high
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: A filesystem is above the disk-usage threshold.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: '100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|iso9660|ramfs|devtmpfs",mountpoint=~"/|/opt/.*|/mnt/.*"} * 100 / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|iso9660|ramfs|devtmpfs",mountpoint=~"/|/opt/.*|/mnt/.*"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: {type: gt, params: [{{ alert_disk_used_percent }}]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query

      - uid: host-memory-high
        title: Host memory usage high
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: Host memory usage is above the threshold.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: {type: gt, params: [{{ alert_mem_used_percent }}]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query

      - uid: host-load-high
        title: Host load15 high
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: 15m load average is above the threshold.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: 'node_load15'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: {type: gt, params: [{{ alert_load15 }}]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query

      - uid: container-crash-looping
        title: Container crash-looping
        condition: C
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: A container restarted repeatedly in the last 15m.
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: 'changes(container_start_time_seconds{name!=""}[15m])'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: {type: gt, params: [{{ alert_crashloop_restarts }}]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query

      - uid: tls-cert-expiring
        title: TLS certificate expiring soon
        condition: C
        for: 1h
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: A TLS certificate served by Traefik expires soon.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: '(traefik_tls_certs_not_after - time()) / 86400'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: {type: lt, params: [{{ alert_cert_expiry_days }}]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query

      - uid: monitoring-target-down
        title: Monitoring target down
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: A Prometheus scrape target is down (up == 0).
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: 'up'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query

      - uid: storagebox-mount-lost
        title: Storage Box mount lost
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: The Storage Box CIFS mount is no longer reported by node_exporter.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: 'absent(node_filesystem_size_bytes{mountpoint="{{ storagebox_mount_path }}"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query

      - uid: backup-too-old
        title: Backup too old
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: No successful restic backup within the expected window.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: '(time() - (restic_last_success_timestamp_seconds or on() vector(0))) / 3600'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: {type: gt, params: [{{ alert_backup_age_hours }}]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
