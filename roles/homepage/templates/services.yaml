---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/services
# icons found here https://github.com/walkxcode/dashboard-icons

- Monitoring:
    - Grafana:
        icon: grafana.svg
        href: "https://{{ grafana_host }}"
        description: Metrics & dashboards
        widget:
          type: grafana
          url: "http://tunnel-server:13004"
          username: admin
          password: "{% raw %}{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}{% endraw %}"
    - Oracle:
        icon: mdi-server
        description: Oracle Cloud A1 host
        widget:
          type: prometheusmetric
          url: http://tunnel-server:13008
          refreshInterval: 30000
          metrics:
            - label: CPU
              query: 100 * (1 - avg(rate(node_cpu_seconds_total{host="oracle",mode="idle"}[2m])))
              format:
                type: percent
                options:
                  maximumFractionDigits: 1
            - label: RAM
              query: 100 * (1 - node_memory_MemAvailable_bytes{host="oracle"} / node_memory_MemTotal_bytes{host="oracle"})
              format:
                type: percent
                options:
                  maximumFractionDigits: 1
            - label: Disk
              query: 100 - 100 * node_filesystem_avail_bytes{host="oracle",mountpoint="/"} / node_filesystem_size_bytes{host="oracle",mountpoint="/"}
              format:
                type: percent
                options:
                  maximumFractionDigits: 1
            - label: Load
              query: node_load5{host="oracle"}
              format:
                type: number
                options:
                  maximumFractionDigits: 2
    - Gatus (Oracle):
        icon: gatus.svg
        href: "https://{{ oracle_gatus_host }}"
        description: External uptime monitoring (Oracle)
    - Gatus:
        server: my-docker
        icon: gatus.svg
        href: "https://{{ gatus_host }}"
        description: Service health
        widget:
          type: gatus
          url: http://gatus:8080
    - Prometheus:
        icon: prometheus.svg
        description: Time-series database
        widget:
          type: prometheus
          url: http://tunnel-server:13008
    - Dozzle:
        server: my-docker
        icon: dozzle.png
        href: "https://{{ dozzle_host }}"
        description: Container logs
    - Backrest:
        server: my-docker
        icon: backrest.svg
        href: "https://{{ backrest_host }}"
        description: Backup browser & restore
    - Cup:
        server: my-docker
        icon: cup.png
        href: "https://{{ cup_host }}"
        description: Image update checker
        widget:
          type: customapi
          url: http://cup:8000/api/v3/json
          refreshInterval: 600000
          mappings:
            - field:
                metrics: monitored_images
              label: Monitored
            - field:
                metrics: updates_available
              label: Updates
            - field:
                metrics: major_updates
              label: Major
            - field:
                metrics: up_to_date
              label: Up to date

- Network & Security:
    - Traefik:
        server: my-docker
        icon: traefik.svg
        href: "https://{{ traefik_host }}"
        description: Reverse proxy
        widget:
          type: traefik
          url: https://{{ traefik_host }}
          username: user
          password: "{% raw %}{{HOMEPAGE_VAR_TRAEFIK_PASSWORD}}{% endraw %}"
    - Crowdsec:
        server: my-docker
        icon: crowdsec.svg
        href: https://app.crowdsec.net/alerts
        description: Intrusion prevention
        widget:
          type: crowdsec
          url: http://crowdsec:8080
          username: testMachine
          password: "{% raw %}{{HOMEPAGE_VAR_CROWDSEC_MACHINE_API_KEY}}{% endraw %}"
    - Adguard:
        server: my-docker
        icon: adguard-home.svg
        href: "https://{{ adguard_host }}"
        description: DNS ad blocker
        widget:
          type: adguard
          url: http://adguardhome:3000
          username: admin
          password: "{% raw %}{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}{% endraw %}"
    - AmneziaWG:
        server: my-docker
        icon: wireguard.svg
        href: "https://{{ vpn_host }}"
        description: VPN gateway
        widget:
          type: wgeasy
          version: 2
          url: http://amnezia-wg:51821
          username: "{{ amnezia_wg_admin_username }}"
          password: "{% raw %}{{HOMEPAGE_VAR_AMNEZIA_PASSWORD}}{% endraw %}"
    - Proxy (Reality + Hysteria2):
        server: my-docker
        icon: mdi-shield-lock
        description: "VLESS+Vision+Reality (TCP 8443) / Hysteria2 (UDP 443)"

