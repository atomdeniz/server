---
- name: Create the convertx directory
  ansible.builtin.file:
    path: "{{ docker_dir }}/convertx"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0775"

- name: Make sure the convertx container is created and running
  community.general.docker_container:
    name: "convertx"
    image: "ghcr.io/c4illin/convertx:{{ convertx_version }}"
    pull: "always"
    recreate: "{{ force_recreate | default(false) }}"
    state: started
    restart_policy: unless-stopped
    security_opts:
      - no-new-privileges:true
      - apparmor:docker-default
    networks:
      - name: app_network
    env:
      ALLOW_UNAUTHENTICATED: "true"
    volumes:
      - "{{ docker_dir }}/convertx:/app/data"
