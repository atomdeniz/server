name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - run: pip install -r .github/requirements-ci.txt

      - run: ansible-galaxy install -r requirements.yml

      - run: yamllint .

      - run: ansible-playbook playbook.yml -i inventory.yml --syntax-check

      - run: ansible-playbook bootstrap.yml -i inventory.yml --syntax-check

      - run: ansible-lint playbook.yml bootstrap.yml
